name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    if: github.repository == 'Neopilot-Ai/neocode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # neocode_change
        # neocode_change start
        with:
          persist-credentials: false
        # neocode_change end

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # neocode_change start
          neo-maintainer-app-id: ${{ secrets.NEO_MAINTAINER_APP_ID }}
          neo-maintainer-app-secret: ${{ secrets.NEO_MAINTAINER_APP_SECRET }}
          # neocode_change end

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
