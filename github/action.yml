name: "Neo GitHub Action"
description: "Run Neo AI agent in GitHub Actions workflows"
branding:
  icon: "code"
  color: "gray-dark"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Neo session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Neo App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/neo,/kc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.neo.khulnasoft.com"
    required: false

  neo_api_key:
    description: "Neo API key for gateway authentication"
    required: false

  neo_org_id:
    description: "Neo organization ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Neo version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/Neopilot-Ai/neocode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache Neo
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.neo/bin
        key: neo-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Neo
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://neo.khulnasoft.com/cli/install | bash

    - name: Add Neo to PATH
      shell: bash
      run: echo "$HOME/.neo/bin" >> $GITHUB_PATH

    - name: Run Neo
      shell: bash
      id: run_neo
      run: neo github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        NEO_API_KEY: ${{ inputs.neo_api_key }}
        NEO_ORG_ID: ${{ inputs.neo_org_id }}
