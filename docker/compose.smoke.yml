version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: neocode
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: neocode
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neocode -d neocode"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - neocode-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neocode-postgres-data:
